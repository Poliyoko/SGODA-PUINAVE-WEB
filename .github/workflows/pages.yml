name: Publicar SGODA-PUINAVE Web en GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - gh-pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sgoda-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener exclusivamente la distribucion compilada
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Comprobar distribucion compilada REAL508
        run: |
          set -euo pipefail
          test -f index.html
          test -f main.dart.js
          test -f flutter_bootstrap.js
          test -f assets/real508/corpus.json
          test -f assets/real508/category-assignments.json
          test ! -f audio-manifest.json
          python3 - <<'PY'
          import json
          with open('assets/real508/corpus.json',encoding='utf-8') as f: c=json.load(f)
          with open('assets/real508/category-assignments.json',encoding='utf-8') as f: a=json.load(f)
          assert len(c['records'])==508
          assert len({r['entryId'] for r in c['records']})==508
          assert len(a['records'])==508
          assert '/SGODA-PUINAVE-WEB/' in open('index.html',encoding='utf-8').read()
          print('PASS: compilado REAL508 sin manifiesto privado listo para Pages')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
